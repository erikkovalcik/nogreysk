<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Tím noGrey pri tvorbe webov">
  <defs>
    <linearGradient id="tg-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E9DE5"/>
      <stop offset="1" stop-color="#2BE0A6"/>
    </linearGradient>
    <linearGradient id="tg-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E9DE5"/>
      <stop offset="1" stop-color="#2BE0A6"/>
