    <rect x="216" y="140" width="52" height="18" rx="6" fill="#fff"/>
    <rect x="216" y="172" width="64" height="20" rx="6" fill="#fff" opacity="0.85"/>
    <rect x="290" y="172" width="64" height="20" rx="6" fill="#fff" opacity="0.7"/>
    <rect x="364" y="172" width="64" height="20" rx="6" fill="#fff" opacity="0.85"/>
