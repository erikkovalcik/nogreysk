    <circle cx="224" cy="65" r="3.5" fill="#FFBD2E"/>
    <circle cx="236" cy="65" r="3.5" fill="#28C840"/>
    <rect x="196" y="78" width="248" height="124" fill="url(#tg-screen)"/>
