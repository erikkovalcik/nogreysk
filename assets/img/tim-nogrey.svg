    <rect x="156" y="262" width="84" height="48" rx="3" fill="url(#tg-screen)"/>
    <rect x="163" y="270" width="40" height="6" rx="3" fill="#fff" opacity="0.9"/>
    <rect x="163" y="282" width="30" height="5" rx="2.5" fill="#fff" opacity="0.7"/>
